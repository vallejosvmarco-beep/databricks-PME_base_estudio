bundle:
  name: PME_base

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalogo Unity Catalog existente del proyecto PME_base
    default: datosami
  schema:
    description: Esquema existente donde se publican las tablas de PME_base
    default: datos
  pme_base_path:
    description: Ruta del volumen de aterrizaje con los datos PME (parquet particionado por periodo/mes)
    default: /Volumes/datosami/datos/vol_alunizaje/ami/PME/
  # Ventana de meses PME (misma logica que AMI_base). "ultimo" = ultimo mes del landing.
  pme_periodo:
    default: ultimo
  pme_mes:
    default: ultimo
  # "1" = solo el ultimo mes; "N" = N meses; "todos" = todo el historial del landing.
  pme_meses_historial:
    default: todos
  warehouse_id:
    description: SQL warehouse existente para la tarea de inicializacion

targets:
  dev:
    default: true
    mode: development
    variables:
      warehouse_id: fac1da9aa4b8e6dd
